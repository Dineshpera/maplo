name: Deploy site

# Publishes site/ to GitHub Pages: on every push to main, after each daily data update, or by hand.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update data"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # deploy-pages sometimes fails with "Fetching artifact metadata failed" right after a successful upload
      # (GitHub's artifact service lagging; seen 21 and 22 Nov 2026). The same artifact deploys fine a few
      # minutes later, so try again after 1 and then 3 more minutes. The job fails only if all three fail.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.retry1.outcome == 'failure'
        run: sleep 180
      - id: retry2
        if: steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v5
