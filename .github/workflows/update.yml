name: Update data

on:
  schedule:
    - cron: "30 0 * * *"   # jobs every day, 06:00 IST
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the health check says the data looks broken"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write   # the health check opens or comments on a "data-health" issue

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Map data (Mondays or manual runs only; public Overpass servers ask for light use)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python pipeline/fetch_osm.py
          fi
      - name: Jobs
        run: python pipeline/fetch_jobs.py
      - name: Keep the live data for comparison
        run: cp site/data/core.json "$RUNNER_TEMP/core_live.json"
      - name: Build
        run: python pipeline/build.py
      - name: Health check (stops here if the new data looks broken)
        run: >-
          python pipeline/check.py "$RUNNER_TEMP/core_live.json" site/data/core.json
          --report "$RUNNER_TEMP/health.md" ${{ inputs.force && '--force' || '' }}
      - name: Commit
        run: |
          git config user.name "maplo-bot"
          git config user.email "maplo-bot@users.noreply.github.com"
          git add data site/data site/b site/c
          git diff --cached --quiet || git commit -m "Data update $(date -u +%F)"
          git push
      - name: Report problems in a GitHub issue
        if: always()
        continue-on-error: true   # a failed issue call must not stop the site deploy that follows this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          f="$RUNNER_TEMP/health.md"
          if [ "${{ job.status }}" != "success" ] && [ ! -s "$f" ]; then
            printf '### Daily data run failed, %s\n\n- A step failed before the health check finished. Nothing was published.\n' "$(date -u +%F)" > "$f"
          fi
          [ -s "$f" ] || { echo "Nothing to report"; exit 0; }
          printf '\n[Run log](%s)\n' "$RUN_URL" >> "$f"
          gh label create data-health --color D93F0B --description "Problems found by the daily data run" --force
          n=$(gh issue list --label data-health --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file "$f"
          else
            gh issue create --title "Data health: problems in the daily run" --label data-health --body-file "$f"
          fi
